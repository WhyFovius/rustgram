[package]
name = "rustgram"
version = "0.2.0"
edition = "2021"

[lib]
# cdylib is what Android packages; the lib target lets the desktop preview
# example link against the same code.
crate-type = ["cdylib", "lib"]

[dependencies]
tg_core = { path = "../../crates/tg_core" }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[package.metadata.android]
package = "com.rustgram.app"
apk_name = "rustgram"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
